services:
  db:
    image: postgres:17
    container_name: the-high-screen-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-the_high_screen}
      POSTGRES_USER: ${POSTGRES_USER:-ths_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ths_dev_password}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: the-high-screen-django
    restart: unless-stopped

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-the_high_screen}
      POSTGRES_USER: ${POSTGRES_USER:-ths_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ths_dev_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: