services:
  db:
    image: postgres:17
    container_name: the-high-screen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: the_high_screen
      POSTGRES_USER: ths_user
      POSTGRES_PASSWORD: ths_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: the-high-screen-django
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      POSTGRES_DB: the_high_screen
      POSTGRES_USER: ths_user
      POSTGRES_PASSWORD: ths_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      - db
    command: python manage.py runserver 0.0.0.0:8000

volumes:
  postgres_data: