{% extends "base.html" %}

{% block title %}
    The High Screen
{% endblock %}

{% block page_content %}

    {% for post in posts %}

        {% include "blog/partials/post_preview.html" %}

        {% if not forloop.last %}
            <hr class="my-4">
        {% endif %}

    {% empty %}

        <p>No posts are currently available.</p>

    {% endfor %}

{% endblock %}
